<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 ToDo List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-bs-theme="dark">
  <div class="container py-4 px-3">
    <h1 class="text-center mb-4">📋 ToDo List</h1>

    <!-- Form Tambah Kategori -->
    <div class="input-group mb-4">
      <input type="text" class="form-control" id="newCategory" placeholder="Tambah kategori baru">
      <button class="btn btn-primary" id="addCategoryBtn">Tambah</button>
    </div>

    <!-- List Kategori -->
    <div class="row g-4" id="categoriesContainer">
      <!-- Kategori akan di-render di sini -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
